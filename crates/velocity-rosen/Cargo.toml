[package]
name = "velocity-rosen"
description = "Velocity's Rosen version control: each project's server, its import, and agent workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Builds Rosen's binaries into Velocity, for releases: the release workflow names them in
# VELOCITY_ROSEN_SERVER_EXE and VELOCITY_ROSEN_CLI_EXE. Development builds find them
# through VELOCITY_ROSEN_BIN or PATH instead.
bundled = []

[dependencies]
# Pinned to a reviewed Rosen commit; move the pin deliberately, like any toolchain pin.
rosen-client = { git = "https://github.com/mESmaC/rosen", rev = "9b7954ce63dd6f560b70e1bbed76693166ba520c" }
# The model types the client does not re-export (snapshot kinds, review thread states).
rosen-core = { git = "https://github.com/mESmaC/rosen", rev = "9b7954ce63dd6f560b70e1bbed76693166ba520c" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
