[package]
name = "velocity-rosen"
description = "Velocity's Rosen version control: each project's server, its import, and agent workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
bindings = ["dep:specta"]
# Builds Rosen's binaries into Velocity, for releases: the release workflow names them in
# VELOCITY_ROSEN_SERVER_EXE and VELOCITY_ROSEN_CLI_EXE. Development builds find them
# through VELOCITY_ROSEN_BIN or PATH instead.
bundled = []

[dependencies]
notify = "8.2"
# Pinned together in workspace.dependencies; move the pins deliberately.
rosen-client.workspace = true
# The model types the client does not re-export (snapshot kinds, review thread states).
rosen-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Read-only R1/R9 mirror observations; matches the pinned Rosen metadata schema.
rusqlite = { version = "0.37", features = ["bundled"] }
specta = { workspace = true, optional = true }
sysinfo = { workspace = true, features = ["system"] }
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
velocity-core.workspace = true
velocity-git.workspace = true
velocity-spec.workspace = true
