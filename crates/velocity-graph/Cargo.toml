[package]
name = "velocity-graph"
description = "The code graph (F19): tree-sitter symbols, files and subsystems, and the graph MCP tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The standalone indexer Collapse pins (C11): the library behind a command line, with no
# Tauri or UI dependencies. `doc = false` because it shares the library's name.
[[bin]]
name = "velocity-graph"
path = "src/bin/velocity-graph.rs"
doc = false

[features]
bindings = ["dep:specta"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1.5"
ignore = "0.4"
notify = "8.2"
rosen-client.workspace = true
rosen-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
specta = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
velocity-rosen.workspace = true
velocity-spec.workspace = true
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
