[package]
name = "velocity-acp"
description = "Velocity's ACP client and agent processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agent-client-protocol = "5.0.0"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.2"
velocity-airc.workspace = true
velocity-graph.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
