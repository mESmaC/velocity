[package]
name = "velocity-acp"
description = "Velocity's ACP client and agent processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agent-client-protocol = "5.0.0"
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
velocity-airc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
