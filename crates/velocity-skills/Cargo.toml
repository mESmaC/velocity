[package]
name = "velocity-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
bindings = ["dep:specta", "velocity-core/bindings"]

[dependencies]
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
tempfile = "3.27"
thiserror.workspace = true
tokio = { version = "1.54", features = ["process", "rt", "time"] }
velocity-acp = { path = "../velocity-acp" }
velocity-core = { path = "../velocity-core" }
velocity-git.workspace = true
velocity-spec.workspace = true

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[lints]
workspace = true
