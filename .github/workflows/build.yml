name: Build and lint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    name: Windows build and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: dev
      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build frontend
        run: pnpm -C ui build
      - name: Build Rust workspace
        run: cargo build --workspace --locked
      - name: Check generated IPC bindings
        run: |
          pnpm -C ui bindings
          git diff --exit-code -- ui/src/lib/bindings.ts
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check frontend
        run: pnpm -C ui check
      - name: Lint frontend
        run: pnpm -C ui lint

  linux:
    name: Linux build and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Tauri's WebKitGTK shell and its tray icon. The keyring and notifications speak
      # D-Bus in pure Rust, so they need no libdbus headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: dev
      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      # The app embeds the built UI, so its crate needs `ui/dist` to compile.
      - name: Build frontend
        run: pnpm -C ui build
      - name: Build Rust workspace
        run: cargo build --workspace --locked
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Keeps the pinned Rosen built in the default branch's cache, which a release on any
  # ref can restore (#434). Cargo.toml pins no Rosen release yet, so without this the
  # release's `rosen` job built Rosen from source for about five minutes after every pin
  # bump while the app build waited for it. With the cache filled this job takes under a
  # minute, and running on every push keeps the cache from expiring unused.
  # The steps, cache path and cache key are those of release.yml's `rosen` job. Keep
  # them the same, or the release never finds this cache.
  rosen:
    name: Warm the pinned Rosen cache
    # A pull request's cache is private to it, so only a push fills the shared one.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            Cargo.toml
            crates/velocity-rosen/Cargo.toml
            rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Read the Rosen pin
        id: rosen-pin
        shell: pwsh
        run: ./.github/scripts/rosen-pin.ps1
      # A pinned Rosen release with its binaries attached needs no source build or cache.
      - name: Download the pinned Rosen release
        id: prebuilt
        shell: pwsh
        run: >-
          ./.github/scripts/rosen-fetch.ps1
          -Url '${{ steps.rosen-pin.outputs.url }}'
          -Rev '${{ steps.rosen-pin.outputs.rev }}'
          -Release '${{ steps.rosen-pin.outputs.release }}'
          -Destination "$env:RUNNER_TEMP\rosen\bin"
      - name: Cache pinned Rosen installation
        id: rosen-cache
        if: steps.prebuilt.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rosen
          key: rosen-${{ runner.os }}-${{ runner.arch }}-${{ steps.rosen-pin.outputs.rev }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build Rosen
        if: steps.prebuilt.outputs.found != 'true' && steps.rosen-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo install --locked --git '${{ steps.rosen-pin.outputs.url }}' --rev '${{ steps.rosen-pin.outputs.rev }}' --root "$env:RUNNER_TEMP\rosen" rosen-server rosen-cli
          if ($LASTEXITCODE -ne 0) { throw "Could not build Rosen" }
