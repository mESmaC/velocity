name: Release

# A `v*` tag builds Velocity, signs every download with the updater key and publishes the
# GitHub Release plus the update manifest the app checks (SPEC.md F1 Updates). A tag with a
# pre-release part (`v0.1.0-beta.2`) is published as a pre-release and builds no MSI,
# because MSI versions must be numeric.
#
# Once the mirror is Collapse, GitHub receives only the default branch its forwarder
# delivers, never tags (#431). Velocity then cuts a release by dispatching this workflow
# with `tag`, the landed `commit` and Rosen's last `green` commit covering it; the
# workflow creates the tag on that commit when it publishes, so nothing is tagged unless
# the gate passes. A dispatch with only `tag` releases an existing tag.
#
# The gate and the build run side by side, and `publish` waits for both, so a release
# takes as long as the slower of the two instead of their sum (#498). Nothing is
# published unless the gate passes. The build and the stress suite start once `rosen`
# has fetched the pinned Rosen, which they share instead of each compiling it (#433).
#
# The gate is three jobs (#434): `checks` reads integration and release-blocker issues in
# a minute, then `stress` (Windows) and `proofs` (Linux) run in parallel. A `-beta` tag
# whose exact commit Rosen reports green skips `stress` and `proofs`, so a beta takes
# only as long as the build; numbered releases and other pre-releases run every job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0-beta.2. Without `commit` it must exist.
        required: true
      commit:
        description: Landed commit to tag and release (40 hex). Velocity's Cut release sets it.
        required: false
        default: ''
      green:
        description: Rosen's last green commit, which covers `commit` (40 hex).
        required: false
        default: ''

# Each job grants only the repository access it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  TAG: ${{ inputs.tag || github.ref_name }}
  # A dispatch with `commit` builds that commit; the tag does not exist until publish.
  RELEASE_COMMIT: ${{ inputs.commit }}
  RELEASE_REF: ${{ inputs.commit || inputs.tag || github.ref_name }}
  GREEN_COMMIT: ${{ inputs.green }}
  TAURI_CLI: '@tauri-apps/cli@2.12.4'
  # The rolling release whose `latest.json` every installed copy reads.
  MANIFEST_TAG: updater

jobs:
  # The gate and the build both need the pinned Rosen; this job gets it once for both (#433).
  # A pinned Rosen release supplies prebuilt binaries, checked against the pinned rev and
  # their SHA-256 sums. Without one, Rosen is built from source here, cached by rev, and
  # the two jobs share the result through the `rosen-windows` artifact.
  rosen:
    name: Get Rosen
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          sparse-checkout: |
            .github/scripts
            Cargo.toml
            crates/velocity-rosen/Cargo.toml
            rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Read the Rosen pin
        id: rosen-pin
        shell: pwsh
        run: ./.github/scripts/rosen-pin.ps1
      - name: Download the pinned Rosen release
        id: prebuilt
        shell: pwsh
        run: >-
          ./.github/scripts/rosen-fetch.ps1
          -Url '${{ steps.rosen-pin.outputs.url }}'
          -Rev '${{ steps.rosen-pin.outputs.rev }}'
          -Release '${{ steps.rosen-pin.outputs.release }}'
          -Destination "$env:RUNNER_TEMP\rosen\bin"
      # Keyed on the pinned commit, not Velocity's lockfile: `cargo install --locked` builds
      # from Rosen's own lockfile, so only a new pin or toolchain changes the binaries.
      - name: Cache pinned Rosen installation
        id: rosen-cache
        if: steps.prebuilt.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rosen
          key: rosen-${{ runner.os }}-${{ runner.arch }}-${{ steps.rosen-pin.outputs.rev }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build Rosen
        if: steps.prebuilt.outputs.found != 'true' && steps.rosen-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo install --locked --git '${{ steps.rosen-pin.outputs.url }}' --rev '${{ steps.rosen-pin.outputs.rev }}' --root "$env:RUNNER_TEMP\rosen" rosen-server rosen-cli
          if ($LASTEXITCODE -ne 0) { throw "Could not build Rosen" }
      - uses: actions/upload-artifact@v4
        with:
          name: rosen-windows
          path: |
            ${{ runner.temp }}/rosen/bin/rosen.exe
            ${{ runner.temp }}/rosen/bin/rosen-server.exe
          if-no-files-found: error
          retention-days: 1

  # The release is the gate (SPEC.md F7 "The release gate", #381): on a Rosen project no
  # approval gates a land, so nothing is published until the release commit passes
  # integration, the stress suite and the proofs, with no release-blocker open.
  # `checks` is the gate's first stage; `stress` and `proofs` start only after it passes.
  checks:
    name: Release gate checks
    permissions:
      contents: read
      # The release gate lists open release-blocker issues.
      issues: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_gate: ${{ steps.path.outputs.full_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          # The gate checks the release commit is an ancestor of Rosen's green commit.
          fetch-depth: 0
      # A dispatched release names its commit; refuse a tag already on another commit
      # before anything is published.
      - name: Check the release tag is free or already on the release commit
        if: env.RELEASE_COMMIT != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw "commit $env:RELEASE_COMMIT is not a full commit ID" }
          if ($env:GREEN_COMMIT -and $env:GREEN_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw "green $env:GREEN_COMMIT is not a full commit ID" }
          $tagged = gh api "repos/${{ github.repository }}/commits/$env:TAG" --jq .sha 2>$null
          $global:LASTEXITCODE = 0
          if ($tagged -and $tagged -cne $env:RELEASE_COMMIT) { throw "$env:TAG already exists on $tagged, not $env:RELEASE_COMMIT" }
      - name: Require green integration and no release-blocker issue
        id: checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/release-gate.ps1 -Repository ${{ github.repository }} -Green "$env:GREEN_COMMIT" -Stage Checks
      # The owner's decision on #434: a `-beta` release skips the stress suite and the
      # proofs when Rosen reports that exact commit green and no release-blocker is open.
      # Numbered releases, and pre-releases other than betas, always run the full gate.
      - name: Choose the full gate or the beta path
        id: path
        shell: pwsh
        run: |
          $beta = $env:TAG -cmatch '^v\d+\.\d+\.\d+-beta(\.|$)'
          $exactGreen = '${{ steps.checks.outputs.exact-green }}' -eq 'true'
          $full = -not ($beta -and $exactGreen)
          if ($full) {
            Write-Host "Full gate: beta=$beta, release commit green=$exactGreen"
          } else {
            Write-Host "Beta path: Rosen reports the release commit green, so stress and proofs are skipped"
          }
          "full_gate=$($full.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  stress:
    name: Release gate stress
    needs: [checks, rosen]
    if: needs.checks.outputs.full_gate == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # Keep the stress harness builds within runner memory.
      CARGO_BUILD_JOBS: '2'
      # Build the workspace and the stress harness binary without debug info (#499).
      CARGO_PROFILE_DEV_DEBUG: 'none'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          # Keep the history the stress scripts had when this job was the whole gate.
          fetch-depth: 0
      # Builds write to a Dev Drive: ReFS, without real-time scanning of every file the
      # compiler writes, which slows Rust builds on Windows runners the most (#498).
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 40GB
          drive-format: ReFS
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: gate
          workspaces: '. -> ${{ env.CARGO_TARGET_DIR }}'
      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      # The stress suite creates projects and commits in them, as a developer machine does;
      # a fresh runner has no git identity, so those commits failed (pr7-create-save).
      - name: Give git an identity for the gate's test commits
        shell: pwsh
        run: |
          git config --global user.name "Velocity release gate"
          git config --global user.email "release-gate@velocity.invalid"
      # Stress scripts start real Rosen servers (pr4-goal-stack-crash failed with
      # MissingBinary). Use the pinned Rosen the release carries.
      - name: Get the pinned Rosen
        uses: actions/download-artifact@v4
        with:
          name: rosen-windows
          path: ${{ runner.temp }}/rosen/bin
      - name: Use the pinned Rosen
        shell: pwsh
        run: |
          "VELOCITY_ROSEN_BIN=$env:RUNNER_TEMP\rosen\bin" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP\rosen\bin" >> $env:GITHUB_PATH
      - name: Run the stress suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/release-gate.ps1 -Stage Stress

  # The proofs are platform-independent Lean, so they run on Linux beside the stress
  # suite instead of after it, where Mathlib's cache also downloads faster (#434).
  proofs:
    name: Release gate proofs
    needs: checks
    if: needs.checks.outputs.full_gate == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      # elan installs the toolchain proofs/lean-toolchain pins on first use; Mathlib's
      # built files come from its cache rather than a build from source.
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Cache Lake dependencies so the gate still builds and audits Velocity's proofs.
      - name: Cache Mathlib and Lake dependencies
        id: mathlib-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: proofs/.lake/packages
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
      - name: Fetch Mathlib's cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: proofs
        run: lake exe cache get
      - name: Build and audit the proofs
        shell: pwsh
        run: pwsh -NoProfile -File scripts/release-gate.ps1 -Stage Proofs

  build:
    name: Build and sign
    needs: rosen
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 40GB
          drive-format: ReFS
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release
          workspaces: '. -> ${{ env.CARGO_TARGET_DIR }}'
      - name: Install UI dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag $env:TAG is not v<semver>" }
          $version = $Matches[1]
          $prerelease = [bool]$Matches[2]
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          # The app reports this version to the updater, so it must be the tag's.
          @{ version = $version } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\version.json"

      # Rosen is Velocity's version control (SPEC.md F5). Its binaries are the commit
      # Velocity pins, carried inside the app, so the portable download has them too;
      # Velocity unpacks them on first use.
      - name: Get the pinned Rosen
        uses: actions/download-artifact@v4
        with:
          name: rosen-windows
          path: ${{ runner.temp }}/rosen/bin
      - name: Use the pinned Rosen
        shell: pwsh
        run: |
          "VELOCITY_ROSEN_SERVER_EXE=$env:RUNNER_TEMP\rosen\bin\rosen-server.exe" >> $env:GITHUB_ENV
          "VELOCITY_ROSEN_CLI_EXE=$env:RUNNER_TEMP\rosen\bin\rosen.exe" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          $bundles = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { 'nsis' } else { 'nsis,msi' }
          npx -y $env:TAURI_CLI build --ci --bundles $bundles --features bundled-rosen --config "$env:RUNNER_TEMP\version.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect and sign the downloads
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $release = Join-Path $env:CARGO_TARGET_DIR 'release'
          $out = New-Item -ItemType Directory -Force dist
          Copy-Item (Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1) "$out/Velocity_${version}_x64-setup.exe"
          $msi = Get-ChildItem "$release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi "$out/Velocity_${version}_x64_en-US.msi" }
          # The portable download is the app executable itself.
          $exe = @("$release/Velocity.exe", "$release/velocity-app.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No app executable in $release" }
          Copy-Item $exe "$out/Velocity_${version}_x64-portable.exe"
          # Each signature binds the version, so a manifest can't pair an old package with a new number.
          foreach ($file in Get-ChildItem $out -File) {
            npx -y $env:TAURI_CLI signer sign --app-version $version $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $($file.Name)" }
          }
          Get-ChildItem $out -File -Exclude *.sig | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-downloads
          path: dist/
          if-no-files-found: error

  # The standalone code graph indexer Collapse pins and runs like `git` (C11, #428): a Linux
  # x86-64 build of the `velocity-graph` binary, versioned with the release, so Collapse's
  # graph answers carry the same records and addresses as this release's MCP tools.
  graph-indexer:
    name: Build the code graph indexer
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: graph-indexer
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          target=x86_64-unknown-linux-gnu
          # The binary reports this version in `velocity-graph version`, for Collapse's pin check.
          VELOCITY_GRAPH_VERSION="$version" cargo build --release --locked --target "$target" -p velocity-graph --bin velocity-graph
          name="velocity-graph-${version}-${target}"
          mkdir -p dist "$name"
          cp "target/$target/release/velocity-graph" LICENSE "$name/"
          "$name/velocity-graph" version
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: graph-indexer
          path: dist/
          if-no-files-found: error

  # A skipped job would skip `publish` too, so its condition names each job: the checks
  # and the builds always pass, and stress and proofs pass unless the beta path skipped them.
  publish:
    name: Publish
    needs: [checks, stress, proofs, build, graph-indexer]
    if: >-
      !cancelled()
      && needs.checks.result == 'success'
      && needs.build.result == 'success'
      && needs.graph-indexer.result == 'success'
      && (needs.checks.outputs.full_gate == 'false'
        || (needs.stress.result == 'success' && needs.proofs.result == 'success'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-downloads
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: graph-indexer
          path: dist/

      - name: Publish the release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            # A dispatched release creates its tag here, on the gated commit (#431).
            $target = if ($env:RELEASE_COMMIT) { @('--target', $env:RELEASE_COMMIT) } else { @('--verify-tag') }
            $flags = @('--generate-notes') + $target + @('--title', "Velocity $env:VERSION")
            if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
            gh release create $env:TAG @flags
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release" }
          }
          gh release upload $env:TAG (Get-ChildItem dist -File).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the downloads" }

      - name: Publish the update manifest
        shell: pwsh
        run: |
          $version = $env:VERSION
          $base = "https://github.com/$env:GH_REPO/releases/download/$env:TAG"
          function Entry($name) {
            @{ url = "$base/$name"; signature = (Get-Content -Raw "dist/$name.sig").Trim() }
          }
          $setup = Entry "Velocity_${version}_x64-setup.exe"
          $platforms = [ordered]@{
            'windows-x86_64' = $setup
            'windows-x86_64-nsis' = $setup
            'windows-x86_64-portable' = Entry "Velocity_${version}_x64-portable.exe"
          }
          if (Test-Path "dist/Velocity_${version}_x64_en-US.msi") {
            $platforms['windows-x86_64-msi'] = Entry "Velocity_${version}_x64_en-US.msi"
          }
          $notes = gh release view $env:TAG --json body --jq .body | Out-String
          [ordered]@{
            version = $version
            notes = $notes.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = $platforms
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          gh release upload $env:TAG dist/latest.json --clobber
          gh release view $env:MANIFEST_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:MANIFEST_TAG --title "Update manifest" --prerelease --latest=false --target master `
              --notes "Holds latest.json, which installed copies of Velocity read to find updates. Not a download."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the manifest release" }
          }
          gh release upload $env:MANIFEST_TAG dist/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the update manifest" }
