[package]
name = "velocity-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "velocity-app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "velocity_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
velocity-git.workspace = true
velocity-acp = { path = "../crates/velocity-acp" }
velocity-airc.workspace = true
velocity-core = { workspace = true, features = ["bindings"] }
velocity-new-project.workspace = true
velocity-store.workspace = true
velocity-github.workspace = true
velocity-threads.workspace = true
velocity-interview.workspace = true

[lints]
workspace = true
