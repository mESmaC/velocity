[package]
name = "velocity-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "velocity-app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "velocity_app_lib"
# Desktop only needs the Rust library. Tauri's template also lists "staticlib" and
# "cdylib" for Android and iOS; building them wrote a 650 MB static library and
# linked a DLL on every app change. Add them back only with a mobile target.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
agent-client-protocol = "5.0.0"
anyhow.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
velocity-git.workspace = true
velocity-acp = { path = "../crates/velocity-acp" }
velocity-airc = { workspace = true, features = ["bindings"] }
velocity-core = { workspace = true, features = ["bindings"] }
velocity-new-project.workspace = true
velocity-proofs.workspace = true
velocity-skills = { workspace = true, features = ["bindings"] }
velocity-store.workspace = true
velocity-github.workspace = true
velocity-threads.workspace = true
velocity-interview.workspace = true

[lints]
workspace = true
