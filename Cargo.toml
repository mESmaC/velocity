[workspace]
members = [
    "crates/velocity-acp",
    "crates/velocity-airc",
    "crates/velocity-core",
    "crates/velocity-git",
    "crates/velocity-github",
    "crates/velocity-interview",
    "crates/velocity-new-project",
    "crates/velocity-store",
    "crates/velocity-threads",
    "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "=0.0.13"
sysinfo = { version = "=0.40.1", default-features = false, features = ["disk"] }
tauri = { version = "2.12.5", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "sync", "time"] }
velocity-airc = { path = "crates/velocity-airc" }
velocity-core = { path = "crates/velocity-core" }
velocity-git = { path = "crates/velocity-git" }
velocity-github = { path = "crates/velocity-github" }
velocity-interview = { path = "crates/velocity-interview" }
velocity-new-project = { path = "crates/velocity-new-project" }
velocity-store = { path = "crates/velocity-store" }
velocity-threads = { path = "crates/velocity-threads" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Debug builds spent most of their time on debug info: each binary's PDB was
# about 1.7 GB, and the app crate plus its two links took 9 of a cold build's
# 12 minutes. Line tables keep file:line in panics, backtraces and debuggers;
# dependencies need no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
